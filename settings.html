<div id="besoloom_settings" class="extension_container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Beso Loom｜剧情织机</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="besoloom_quick_controls">
                <label class="checkbox_label besoloom_quick_enable">
                    <input id="besoloom_enabled" type="checkbox" />
                    <span>启用 Beso Loom</span>
                </label>
                <button id="besoloom_float_toggle" class="menu_button" type="button">关闭浮窗</button>
                <button id="besoloom_update" class="menu_button" type="button">↻ 更新</button>
            </div>

            <!-- Core controls stay mounted for Beso Loom's existing logic, but all user-facing editing lives in the floating panel. -->
            <div id="besoloom_internal_controls" hidden aria-hidden="true">
                <input id="besoloom_auto_inspect" type="checkbox" />
                <input id="besoloom_interval" type="number" min="1" max="50" step="1" />
                <select id="besoloom_strictness">
                    <option value="loose">宽松</option>
                    <option value="balanced">平衡</option>
                    <option value="strict">严格</option>
                </select>

                <textarea id="besoloom_outline"></textarea>
                <button id="besoloom_save_route" type="button">保存线路</button>
                <button id="besoloom_ai_split" type="button">AI 粗拆节点</button>
                <textarea id="besoloom_hard_limits"></textarea>

                <div id="besoloom_chat_controls">
                    <b id="besoloom_position">—</b>
                    <span id="besoloom_status" data-state="idle">等待剧情路线</span>
                    <div id="besoloom_nodes"></div>
                    <button id="besoloom_prev" type="button">← 上一节点</button>
                    <button id="besoloom_inspect" type="button">立即巡检</button>
                    <button id="besoloom_next" type="button">下一节点 →</button>
                    <div id="besoloom_inspection_note">暂无巡检记录。</div>
                </div>
            </div>
        </div>
    </div>
</div>
